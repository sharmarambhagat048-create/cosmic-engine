<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic Engine Exchange</title>
    <style>
        body {
            background-color: #0a0e17;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        h1 { color: #3b82f6; font-size: 28px; }
        .box {
            background-color: #131c2e;
            border: 1px solid #3b82f6;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            text-align: left;
        }
        input {
            padding: 10px;
            width: 70%;
            border-radius: 5px;
            border: none;
            margin-bottom: 10px;
        }
        button {
            padding: 10px 15px;
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }
        .login-area { margin-top: 20px; }
    </style>
</head>
<body>

    <h1>🚀 Cosmic Engine Exchange</h1>
    <p>Where rockets and fusion dreams get argued with equations.</p>

    <!-- Login Section -->
    <div id="login-box" class="login-area">
        <input type="text" id="user" placeholder="Enter Name">
        <button onclick="login()">Login</button>
    </div>

    <!-- Main App (Hidden initially) -->
    <div id="main-app" style="display: none;">
        
        <div class="box">
            <h3>🤖 AI Scientist</h3>
            <p id="ai-chat" style="color: #10b981;">[AI Officer]: Hello! Ask me about Ion, Warp, or Fusion engines.</p>
            <input type="text" id="ai-input" placeholder="Ask a question...">
            <button onclick="askAI()">Send</button>
        </div>

        <div class="box">
            <h3>💬 Community Forum</h3>
            <p id="forum-posts" style="color: #8892b0;">- SpaceGeek: How does an ion thruster work?<br>- RocketMan: It uses electric fields.</p>
            <input type="text" id="forum-input" placeholder="Post a message...">
            <button onclick="postForum()">Post</button>
        </div>

        <br>
        <button onclick="logout()" style="background-color: #ef4444;">Logout</button>
    </div>

    <script>
        function login() {
            var name = document.getElementById("user").value;
            if(name === "") { alert("Please enter name!"); return; }
            
            document.getElementById("login-box").style.display = "none";
            document.getElementById("main-app").style.display = "block";
            document.getElementById("ai-chat").innerHTML = "[AI Officer]: Welcome " + name + "! Ask me a question.";
        }

        function logout() {
            document.getElementById("login-box").style.display = "block";
            document.getElementById("main-app").style.display = "none";
            document.getElementById("user").value = "";
        }

        function askAI() {
            var input = document.getElementById("ai-input").value.toLowerCase();
            var chat = document.getElementById("ai-chat");
            if(input === "") return;

            var reply = "Interesting! According to physics, this requires more energy.";
            if(input.includes("ion")) reply = "Ion thrusters have high Isp but low thrust. The Child-Langmuir law limits them.";
            if(input.includes("warp")) reply = "Warp drives need negative energy (exotic matter). Physics allows it, engineering doesn't yet.";
            if(input.includes("fusion")) reply = "Fusion rockets use plasma for extreme velocity. Up to 10,000 km/s exhaust.";

            chat.innerHTML = "[You]: " + input + "<br><br>[AI Officer]: " + reply;
            document.getElementById("ai-input").value = "";
        }

        function postForum() {
            var input = document.getElementById("forum-input").value;
            var posts = document.getElementById("forum-posts");
            if(input === "") return;

            posts.innerHTML += "<br>- You: " + input;
            document.getElementById("forum-input").value = "";
        }
    </script>
</body>
    </html>
